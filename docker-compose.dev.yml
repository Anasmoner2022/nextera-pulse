# Local development database only. Run the API with `go run ./cmd/api`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nextera_pulse
      POSTGRES_USER: nextera_pulse
      POSTGRES_PASSWORD: nextera_pulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nextera_pulse_pg:/var/lib/postgresql/data
      - ./scripts/dev-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextera_pulse -d nextera_pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nextera_pulse_pg:
