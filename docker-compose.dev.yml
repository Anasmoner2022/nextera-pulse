services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: x_pulse
      POSTGRES_USER: x_pulse
      POSTGRES_PASSWORD: x_pulse
    ports:
      - "5432:5432"
    volumes:
      - x_pulse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x_pulse -d x_pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  x_pulse_pg:
