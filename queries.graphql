# Nextera Pulse — 01Edu query pack
# The curriculum event id is ZEROONE_EVENT_ID (default 97); substitute it in the queries below.
# Pilot cohort label: "01 Coding - Second Cohort"

query PulseEventConfig($eventId: Int!) {
  event_by_pk(id: $eventId) {
    id
    path
    startAt
    endAt
    object {
      id
      name
      type
      attrs
    }
  }
}

# Root schema confirms event_user.cohorts is a label_user relation and label_user is queryable.
# The exact label_user field names (label/name/id relation shape) must be confirmed once
# against the live schema before freezing the production cohort query.
query PulsePilotEventUsers($eventId: Int!) {
  event_user(where: {eventId: {_eq: $eventId}}) {
    id
    userId
    userLogin
    createdAt
    level
    userAuditRatio
  }
}

query PulseProgressSince($eventId: Int!, $since: timestamptz!, $limit: Int!, $offset: Int!) {
  progress(
    where: {
      eventId: {_eq: $eventId}
      updatedAt: {_gt: $since}
    }
    order_by: [{updatedAt: asc}, {id: asc}]
    limit: $limit
    offset: $offset
  ) {
    id
    userId
    eventId
    objectId
    groupId
    path
    createdAt
    updatedAt
    gradedAt
    isDone
    grade
    group {
      startedWorkingAt
      status
    }
  }
}

query PulseTransactionsSince($eventId: Int!, $since: timestamptz!, $limit: Int!, $offset: Int!) {
  transaction(
    where: {
      eventId: {_eq: $eventId}
      createdAt: {_gt: $since}
    }
    order_by: [{createdAt: asc}, {id: asc}]
    limit: $limit
    offset: $offset
  ) {
    id
    userId
    eventId
    objectId
    auditId
    path
    type
    amount
    isBonus
    createdAt
    invalidatedAt
  }
}

query PulseRecordsForUsers($userIds: [Int!]!, $limit: Int!, $offset: Int!) {
  record(
    where: {userId: {_in: $userIds}}
    order_by: [{updatedAt: asc}, {id: asc}]
    limit: $limit
    offset: $offset
  ) {
    id
    userId
    typeName
    message
    startAt
    endAt
    createdAt
    updatedAt
  }
}

query PulseAuditsSince($since: timestamptz!, $limit: Int!, $offset: Int!) {
  audit(
    where: {updatedAt: {_gt: $since}}
    order_by: [{updatedAt: asc}, {id: asc}]
    limit: $limit
    offset: $offset
  ) {
    id
    auditorId
    groupId
    resultId
    auditType
    createdAt
    auditedAt
    closedAt
    endAt
    grade
    closureType
    automated
    updatedAt
  }
}

# Roster (replaces the zip export). Used by internal/zeroone/roster_live.go.
query PulseCohortLabels($names: [String!]!) {
  label(where: {name: {_in: $names}}, order_by: {id: asc}) { id name eventId description }
}

query PulseLabelUsers($labelIds: [Int!]!, $limit: Int!, $offset: Int!) {
  label_user(where: {labelId: {_in: $labelIds}}, order_by: {id: asc}, limit: $limit, offset: $offset) { id labelId userId }
}

query PulseUsers($ids: [Int!]!) {
  user(where: {id: {_in: $ids}}, order_by: {id: asc}) { id login firstName lastName email }
}

query PulseStaff($roles: [String!]!) {
  user(where: {role: {_in: $roles}}, order_by: {id: asc}) { id login role }
}
