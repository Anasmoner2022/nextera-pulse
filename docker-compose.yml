version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextera_pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: pulse-api
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/nextera_pulse?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  pgdata:
