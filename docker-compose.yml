# Production-like stack: PostgreSQL + API.
# Secrets come from the repo-root .env (gitignored); see .env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextera_pulse}
      POSTGRES_USER: ${POSTGRES_USER:-nextera_pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host; only the API reaches it.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nextera_pulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nextera_pulse}?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
